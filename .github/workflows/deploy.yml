name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Relative paths don't resolve inside CheerpJ's virtual filesystem, so the
      # data file is pointed at /files/, the writable IndexedDB-backed area.
      # The committed source is untouched, so the desktop build still works.
      - name: Patch the data file path for the browser build
        run: |
          mkdir -p src
          sed 's#FILE_NAME = "students.txt"#FILE_NAME = "/files/students.txt"#' \
              StudentManagementSystem1.java > src/StudentManagementSystem1.java
          grep -n '/files/' src/StudentManagementSystem1.java

      - name: Compile and package
        run: |
          mkdir -p classes
          javac -d classes src/StudentManagementSystem1.java
          jar --create --file student-management.jar \
              --main-class StudentManagementSystem1 -C classes .

      - name: Assemble site
        run: |
          mkdir -p site
          cp web/index.html site/
          cp student-management.jar site/
          ls -la site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
